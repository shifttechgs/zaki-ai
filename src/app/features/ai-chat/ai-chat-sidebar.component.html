<aside aria-label="Conversation sidebar">
  <div class="brand">
    <div class="brand-robot">
      <svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="sc-body" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#4F46E5"/>
          </linearGradient>
          <linearGradient id="sc-eye" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0EA5E9"/>
          </linearGradient>
        </defs>
        <line x1="70" y1="10" x2="70" y2="26" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
        <circle cx="70" cy="7" r="5" fill="#8B5CF6"/>
        <path d="M 32 62 Q 32 22 70 22 Q 108 22 108 62" fill="none" stroke="#6D28D9" stroke-width="7" stroke-linecap="round"/>
        <rect x="22" y="54" width="16" height="24" rx="8" fill="#7C3AED"/>
        <rect x="102" y="54" width="16" height="24" rx="8" fill="#7C3AED"/>
        <circle cx="70" cy="62" r="38" fill="#E8EFF8"/>
        <circle cx="55" cy="58" r="13" fill="url(#sc-eye)"/>
        <circle cx="85" cy="58" r="13" fill="url(#sc-eye)"/>
        <circle cx="59" cy="54" r="5" fill="rgba(255,255,255,0.88)"/>
        <circle cx="89" cy="54" r="5" fill="rgba(255,255,255,0.88)"/>
        <circle cx="57" cy="52" r="2.5" fill="#0C2340"/>
        <circle cx="87" cy="52" r="2.5" fill="#0C2340"/>
        <path d="M 57 76 Q 70 88 83 76" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <rect x="62" y="98" width="16" height="10" rx="4" fill="#CBD5E1"/>
        <rect x="28" y="106" width="84" height="52" rx="14" fill="url(#sc-body)"/>
        <rect x="40" y="118" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.22)"/>
        <rect x="10" y="110" width="18" height="10" rx="5" fill="#6D28D9"/>
        <rect x="112" y="110" width="18" height="10" rx="5" fill="#6D28D9"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">ZAKI <span class="brand-ai">AI</span></span>
      <span class="brand-tagline">Your AI Tutor</span>
    </div>
  </div>

  <div class="sidebar-top">
    <button
      mat-stroked-button
      class="new-chat-btn"
      (click)="service.startNewConversation()"
      aria-label="Start new chat"
    >
      <mat-icon>add</mat-icon>
      New chat
    </button>
  </div>

  <div class="divider"></div>

  <nav class="conversations" role="list" aria-label="Conversation history">
    @for (group of service.groupedConversations(); track group.label) {
      @if (group.conversations.length > 0) {
        <p class="group-label">{{ group.label }}</p>
        @for (conv of group.conversations; track conv.id) {
          <app-conversation-item
            [conversation]="conv"
            [isActive]="service.activeId() === conv.id"
          />
        }
      }
    }
  </nav>

  <!-- ── User account footer ───────────────────────────────────────────────── -->
  <div class="sidebar-footer">
    <button
      class="user-trigger"
      [matMenuTriggerFor]="userMenu"
      aria-label="Account menu"
      aria-haspopup="true"
      type="button"
    >
      <div class="user-avatar">{{ user.initials }}</div>
      <div class="user-info">
        <span class="user-name">{{ user.name }}</span>
        <span class="user-plan">{{ user.plan }}</span>
      </div>
      <span class="upgrade-pill">Upgrade</span>
    </button>
  </div>
</aside>

<!-- ── User menu (renders in CDK overlay, above trigger) ──────────────────── -->
<mat-menu #userMenu="matMenu" panelClass="user-menu-panel" yPosition="above">

  <!-- Top row: avatar + name + plan + chevron -->
  <div class="ump-user-row" tabindex="0" role="menuitem" (keydown.enter)="$event.preventDefault()">
    <div class="ump-avatar">{{ user.initials }}</div>
    <div class="ump-user-info">
      <span class="ump-name">{{ user.name }}</span>
      <span class="ump-plan">{{ user.plan }}</span>
    </div>
    <svg class="ump-chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18l6-6-6-6"/>
    </svg>
  </div>

  <mat-divider class="ump-divider"/>

  <!-- Upgrade plan -->
  <button mat-menu-item class="ump-item ump-item--upgrade">
    <span class="ump-row">
      <svg class="ump-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
      <span>Upgrade plan</span>
    </span>
  </button>

  <!-- Personalization -->
  <button mat-menu-item class="ump-item">
    <span class="ump-row">
      <svg class="ump-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
        <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
        <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
      </svg>
      <span>Personalization</span>
    </span>
  </button>

  <!-- Profile -->
  <button mat-menu-item class="ump-item">
    <span class="ump-row">
      <svg class="ump-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Profile</span>
    </span>
  </button>

  <!-- Settings -->
  <button mat-menu-item class="ump-item">
    <span class="ump-row">
      <svg class="ump-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Settings</span>
    </span>
  </button>

  <mat-divider class="ump-divider"/>

  <!-- Help -->
  <button mat-menu-item class="ump-item">
    <span class="ump-row">
      <svg class="ump-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span class="ump-item-text-grow">Help</span>
      <svg class="ump-chevron-sm" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </span>
  </button>

  <!-- Log out -->
  <button mat-menu-item class="ump-item">
    <span class="ump-row">
      <svg class="ump-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Log out</span>
    </span>
  </button>

</mat-menu>
