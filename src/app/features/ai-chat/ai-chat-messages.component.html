<div
  class="messages"
  role="log"
  aria-label="Conversation"
  aria-live="polite"
>
  @for (message of service.activeConversation()?.messages ?? []; track message.id) {
    <app-chat-message [message]="message" />
  }

  @if (service.isResponding()) {
    <div class="typing-indicator">
      <div class="typing-avatar" aria-hidden="true">
        <mat-icon>auto_awesome</mat-icon>
      </div>
      <div class="typing-dots" aria-label="Zaki is typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  }

  <div #bottom class="scroll-anchor"></div>
</div>
