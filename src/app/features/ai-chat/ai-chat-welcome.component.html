<div class="welcome">
  <div class="content">

    <div class="logo">
      <mat-icon>auto_awesome</mat-icon>
    </div>

    <h2 class="heading">What can I help with?</h2>

    <div class="suggestions">
      @for (s of suggestions; track s.title) {
        <app-suggestion-card
          [icon]="s.icon"
          [title]="s.title"
          [description]="s.description"
          [gradient]="s.gradient"
          (selected)="useSuggestion(s.title)"
        />
      }
    </div>

  </div>
</div>
