<div class="glass-wrap" [class.listening]="isListening()">

  <!-- Textarea -->
  <textarea
    #textarea
    class="input-field"
    placeholder="Ask anything…"
    [value]="message()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    rows="1"
    aria-label="Message input"
    aria-multiline="true"
    [disabled]="service.isResponding()"
  ></textarea>

  <!-- Recording label -->
  @if (isListening()) {
    <div class="recording-label">
      <span class="rec-dot"></span>
      Listening…
    </div>
  }

  <!-- Action row: mic left — send right -->
  <div class="actions-row">
    <div class="left-actions">
      @if (voiceSupported) {
        <button
          mat-icon-button
          class="action-btn mic-btn"
          [class.recording]="isListening()"
          (click)="toggleVoice()"
          [attr.aria-label]="isListening() ? 'Stop recording' : 'Start voice input'"
          [matTooltip]="isListening() ? 'Stop recording' : 'Voice input'"
          matTooltipPosition="above"
          type="button"
        >
          <mat-icon>{{ isListening() ? 'stop' : 'mic' }}</mat-icon>
        </button>
      }
    </div>

    <div class="right-actions">
      <button
        mat-icon-button
        class="send-btn"
        (click)="send()"
        [disabled]="!message().trim() || service.isResponding()"
        aria-label="Send message"
        matTooltip="Send  (Enter)"
        matTooltipPosition="above"
        type="button"
      >
        <mat-icon>arrow_upward</mat-icon>
      </button>
    </div>
  </div>

</div>

<!-- Footer -->
<div class="input-footer">
  <div class="model-pill">
    <mat-icon class="model-icon">smart_toy</mat-icon>
    Zaki
  </div>
  <span class="sep">·</span>
  <span class="disclaimer">AI can make mistakes. Check important info.</span>
</div>
