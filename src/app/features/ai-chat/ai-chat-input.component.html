<div class="input-shell">
  <div class="pill" [class.listening]="isListening()">

    <!-- Left slot: voice button -->
    <div class="pill-left">
      @if (voiceSupported) {
        <button
          mat-icon-button
          class="pill-btn mic-btn"
          [class.recording]="isListening()"
          (click)="toggleVoice()"
          [attr.aria-label]="isListening() ? 'Stop recording' : 'Start voice input'"
          [matTooltip]="isListening() ? 'Stop recording' : 'Voice input'"
          matTooltipPosition="above"
          type="button"
        >
          <mat-icon>{{ isListening() ? 'stop' : 'mic' }}</mat-icon>
        </button>
      }
    </div>

    <!-- Textarea grows between the two button slots -->
    <textarea
      #textarea
      class="input-field"
      [placeholder]="isListening() ? 'Listening…' : 'Message Zaki…'"
      [value]="message()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      rows="1"
      aria-label="Message input"
      aria-multiline="true"
      [disabled]="service.isResponding()"
    ></textarea>

    <!-- Right slot: send button -->
    <div class="pill-right">
      <button
        mat-icon-button
        class="send-btn"
        (click)="send()"
        [disabled]="!message().trim() || service.isResponding()"
        aria-label="Send message"
        matTooltip="Send  (Enter)"
        matTooltipPosition="above"
        type="button"
      >
        <mat-icon>arrow_upward</mat-icon>
      </button>
    </div>

  </div>

  <p class="disclaimer">
    Zaki can make mistakes. Check important info.
  </p>
</div>
