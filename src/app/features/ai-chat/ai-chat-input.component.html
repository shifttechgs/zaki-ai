<div class="input-shell">
  <div class="input-card" [class.listening]="isListening()">

    <textarea
      #textarea
      class="input-field"
      [placeholder]="isListening() ? 'Listening…' : 'Ask anything'"
      [value]="message()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      rows="1"
      aria-label="Message input"
      aria-multiline="true"
      [disabled]="service.isResponding()"
    ></textarea>

    <div class="toolbar">

      <!-- ── Left: attach + model chip ───────────────────────────────────── -->
      <div class="toolbar-left">

        <button class="tool-btn" type="button" aria-label="Attach file">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>

        <button class="model-chip" type="button" aria-label="Select model">
          <span class="model-chip-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2l2.09 6.26H21l-5.47 3.97 2.09 6.26L12 14.52l-5.62 3.97 2.09-6.26L3 8.26h6.91L12 2z"/>
            </svg>
          </span>
          <span>Zaki</span>
        </button>

      </div>

      <!-- ── Right: think + mic + send ────────────────────────────────────── -->
      <div class="toolbar-right">

        <button class="think-btn" type="button" aria-label="Enable deep thinking">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="8" cy="12" r="6"/>
            <circle cx="16" cy="12" r="6"/>
          </svg>
          <span>Think</span>
        </button>

        @if (voiceSupported) {
          <button
            class="tool-btn"
            [class.mic-active]="isListening()"
            (click)="toggleVoice()"
            [attr.aria-label]="isListening() ? 'Stop recording' : 'Voice input'"
            matTooltip="Voice input"
            matTooltipPosition="above"
            type="button"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="8" y1="22" x2="16" y2="22"/>
            </svg>
          </button>
        }

        <!-- Send / stop / waveform -->
        @if (isListening()) {
          <button class="send-btn" (click)="toggleVoice()" aria-label="Stop recording" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="3.5"/>
            </svg>
          </button>
        } @else if (message().trim()) {
          <button
            class="send-btn"
            (click)="send()"
            [disabled]="service.isResponding()"
            aria-label="Send message"
            matTooltip="Send  ↵"
            matTooltipPosition="above"
            type="button"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5"/>
              <path d="M5 12l7-7 7 7"/>
            </svg>
          </button>
        } @else {
          <button class="send-btn" disabled aria-label="Send message" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 20 16" fill="currentColor" aria-hidden="true">
              <rect x="0"    y="5" width="3" height="6"  rx="1.5"/>
              <rect x="4.25" y="2" width="3" height="12" rx="1.5"/>
              <rect x="8.5"  y="0" width="3" height="16" rx="1.5"/>
              <rect x="12.75" y="2" width="3" height="12" rx="1.5"/>
              <rect x="17"  y="5" width="3" height="6"  rx="1.5"/>
            </svg>
          </button>
        }

      </div>
    </div>
  </div>

  <p class="hint">Zaki can make mistakes. Check important info.</p>
</div>
