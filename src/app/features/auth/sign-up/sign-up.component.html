<div class="auth-page">

  <!-- Brand header -->
  <header class="auth-header">
    <a class="brand" routerLink="/ai-chat">
      <span class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2l2.09 6.26H21l-5.47 3.97 2.09 6.26L12 14.52l-5.62 3.97 2.09-6.26L3 8.26h6.91L12 2z"/>
        </svg>
      </span>
      <span class="brand-name">Zaki AI</span>
    </a>
  </header>

  <!-- Card -->
  <main class="auth-main">
    <div class="auth-card">

      <div class="card-head">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-sub">Start building smarter. No credit card required.</p>
      </div>

      <!-- Google SSO -->
      <button class="social-btn" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="divider"><span>or</span></div>

      <!-- Registration form -->
      <form (ngSubmit)="onSubmit()" class="auth-form" novalidate>

        <div class="field">
          <label for="su-name">Full name</label>
          <input
            type="text"
            id="su-name"
            name="fullName"
            [(ngModel)]="fullName"
            placeholder="Alex Johnson"
            autocomplete="name"
            required
          />
        </div>

        <div class="field">
          <label for="su-email">Email address</label>
          <input
            type="email"
            id="su-email"
            name="email"
            [(ngModel)]="email"
            placeholder="you@company.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="field">
          <label for="su-password">Password</label>
          <div class="input-wrap">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="su-password"
              name="password"
              [(ngModel)]="password"
              placeholder="Min. 8 characters"
              autocomplete="new-password"
              required
              minlength="8"
            />
            <button
              type="button"
              class="eye-btn"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            >
              @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="spinner"></span>
          } @else {
            Get started
          }
        </button>

      </form>

      <p class="terms-text">
        By creating an account you agree to our
        <a href="#" class="text-link">Terms of Service</a> and
        <a href="#" class="text-link">Privacy Policy</a>.
      </p>

      <div class="card-divider"></div>

      <p class="switch-text">
        Already have an account? <a routerLink="/auth/sign-in" class="text-link">Sign in</a>
      </p>

    </div>
  </main>

  <footer class="page-footer">
    <a href="#">Terms</a>
    <a href="#">Privacy</a>
    <a href="#">Support</a>
  </footer>

</div>
