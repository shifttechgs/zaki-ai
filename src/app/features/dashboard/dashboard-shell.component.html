<div class="shell">

  <aside class="sidebar">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-robot">
        <svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="sb-body" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#4F46E5"/>
            </linearGradient>
            <linearGradient id="sb-eye" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0EA5E9"/>
            </linearGradient>
          </defs>
          <line x1="70" y1="10" x2="70" y2="26" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
          <circle cx="70" cy="7" r="5" fill="#8B5CF6"/>
          <path d="M 32 62 Q 32 22 70 22 Q 108 22 108 62" fill="none" stroke="#6D28D9" stroke-width="7" stroke-linecap="round"/>
          <rect x="22" y="54" width="16" height="24" rx="8" fill="#7C3AED"/>
          <rect x="102" y="54" width="16" height="24" rx="8" fill="#7C3AED"/>
          <circle cx="70" cy="62" r="38" fill="#E8EFF8"/>
          <circle cx="55" cy="58" r="13" fill="url(#sb-eye)"/>
          <circle cx="85" cy="58" r="13" fill="url(#sb-eye)"/>
          <circle cx="59" cy="54" r="5" fill="rgba(255,255,255,0.88)"/>
          <circle cx="89" cy="54" r="5" fill="rgba(255,255,255,0.88)"/>
          <circle cx="57" cy="52" r="2.5" fill="#0C2340"/>
          <circle cx="87" cy="52" r="2.5" fill="#0C2340"/>
          <path d="M 57 76 Q 70 88 83 76" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <rect x="62" y="98" width="16" height="10" rx="4" fill="#CBD5E1"/>
          <rect x="28" y="106" width="84" height="52" rx="14" fill="url(#sb-body)"/>
          <rect x="40" y="118" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.22)"/>
          <rect x="10" y="110" width="18" height="10" rx="5" fill="#6D28D9"/>
          <rect x="112" y="110" width="18" height="10" rx="5" fill="#6D28D9"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">ZAKI <span class="brand-ai">AI</span></span>
        <span class="brand-tagline">Your AI Tutor</span>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="nav" aria-label="Main navigation">
      @for (item of navItems(); track item.label) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="nav-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Sidebar footer -->
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">{{ auth.user()?.initials }}</div>
        <div class="user-meta">
          <span class="user-name">{{ auth.user()?.name }}</span>
          <span class="user-role">{{ userRoleLabel() }}</span>
        </div>
      </div>
      <button class="logout-btn" type="button" (click)="logout()" aria-label="Log out">
        <mat-icon>logout</mat-icon>
      </button>
    </div>

  </aside>

  <main class="main">
    <router-outlet />
  </main>

</div>
