<div class="chat-wrap">

  <div class="chat-header">
    <div class="header-left">
      <div class="child-avatar">AJ</div>
      <div class="header-info">
        <span class="header-title">Ask AI about Alex Johnson</span>
        <span class="header-sub">Grade 10 · St. Mary's High School</span>
      </div>
    </div>
    <div class="header-badge">
      <span class="dot"></span>
      AI Tutor
    </div>
  </div>

  <div class="chat-body">
    @if (showWelcome()) {
      <app-parent-ai-chat-welcome />
    } @else {
      <app-ai-chat-messages />
    }
  </div>

  <app-ai-chat-input />

</div>
