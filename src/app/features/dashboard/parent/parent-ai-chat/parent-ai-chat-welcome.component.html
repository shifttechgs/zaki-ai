<div class="welcome">

  <!-- Background glows -->
  <div class="glow glow-purple"></div>
  <div class="glow glow-blue"></div>

  <div class="content">

    <!-- Zaki robot SVG -->
    <div class="robot-wrap">
      <svg class="robot" viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7C3AED"/>
            <stop offset="100%" stop-color="#4F46E5"/>
          </linearGradient>
          <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#0EA5E9"/>
          </linearGradient>
          <filter id="glow-f" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Antenna -->
        <line x1="70" y1="10" x2="70" y2="26" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
        <circle cx="70" cy="7" r="5" fill="#8B5CF6" filter="url(#glow-f)"/>

        <!-- Headphone arc -->
        <path d="M 32 62 Q 32 22 70 22 Q 108 22 108 62" fill="none" stroke="#6D28D9" stroke-width="7" stroke-linecap="round"/>
        <!-- Ear pieces -->
        <rect x="22" y="54" width="16" height="24" rx="8" fill="#7C3AED"/>
        <rect x="102" y="54" width="16" height="24" rx="8" fill="#7C3AED"/>

        <!-- Head -->
        <circle cx="70" cy="62" r="38" fill="#E8EFF8"/>

        <!-- Eyes -->
        <circle cx="55" cy="58" r="13" fill="url(#eyeGrad)"/>
        <circle cx="85" cy="58" r="13" fill="url(#eyeGrad)"/>
        <!-- Eye shine -->
        <circle cx="59" cy="54" r="5" fill="rgba(255,255,255,0.88)"/>
        <circle cx="89" cy="54" r="5" fill="rgba(255,255,255,0.88)"/>
        <!-- Pupils -->
        <circle cx="57" cy="52" r="2.5" fill="#0C2340"/>
        <circle cx="87" cy="52" r="2.5" fill="#0C2340"/>

        <!-- Smile -->
        <path d="M 57 76 Q 70 88 83 76" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

        <!-- Neck -->
        <rect x="62" y="98" width="16" height="10" rx="4" fill="#CBD5E1"/>

        <!-- Body -->
        <rect x="28" y="106" width="84" height="52" rx="14" fill="url(#bodyGrad)"/>
        <!-- Body lines -->
        <rect x="40" y="118" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.22)"/>
        <rect x="40" y="130" width="38" height="5" rx="2.5" fill="rgba(255,255,255,0.16)"/>
        <!-- Chest light -->
        <circle cx="98" cy="120" r="4" fill="#38BDF8" filter="url(#glow-f)"/>

        <!-- Arms -->
        <rect x="10" y="110" width="18" height="10" rx="5" fill="#6D28D9"/>
        <rect x="112" y="110" width="18" height="10" rx="5" fill="#6D28D9"/>
      </svg>
      <div class="robot-ring"></div>
    </div>

    <!-- Brand heading -->
    <h1 class="brand">ZAKI <span class="brand-ai">AI</span></h1>
    <p class="brand-sub">Monitoring Alex Johnson · Grade 10</p>

    <!-- Child snapshot strip -->
    <div class="stats-strip">
      @for (s of stats; track s.label) {
        <div class="stat-pill">
          <span class="pill-val">{{ s.value }}</span>
          <span class="pill-lbl">{{ s.label }}</span>
        </div>
      }
    </div>

    <!-- Quick prompts -->
    <div class="prompts-grid">
      @for (p of prompts; track p.label) {
        <button class="prompt-btn" (click)="send(p.message)">
          <mat-icon>{{ p.icon }}</mat-icon>
          <span>{{ p.label }}</span>
        </button>
      }
    </div>

    <p class="tagline">Your questions. Zaki's knowledge. Alex's future.</p>

  </div>
</div>
